[project]
name = "schnaeppli"
version = "0.1.0"
description = "Self-hosted AI shopping agent and deal discovery platform"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  "arq>=0.26",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "httpx>=0.28",
  "anthropic>=2.13",
  "openai>=1.55",
  "google-genai>=1.0",
  "structlog>=24.4",
  "python-multipart>=0.0.17",
  "email-validator>=2.2",
  "pillow>=11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "aiosqlite>=0.20",
  "respx>=0.21",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008", "E501", "ASYNC109", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "B017"]
