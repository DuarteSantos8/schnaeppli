# Schnäppli — self-hosted deployment.
# Copy .env.example to .env, create the secret files (see docs/installation.md),
# then: docker compose up -d
#
# Only the `web` service needs to be reachable, and only from your private network
# or VPN (put a reverse proxy with TLS in front of it). Postgres and Redis are on
# an internal network with no published ports.

name: schnaeppli

x-backend: &backend
  image: ${SCHNAEPPLI_IMAGE_PREFIX:-schnaeppli}-api:${SCHNAEPPLI_VERSION:-latest}
  build: ./backend
  restart: unless-stopped
  env_file: .env
  environment:
    SCHNAEPPLI_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-schnaeppli}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-schnaeppli}
    SCHNAEPPLI_REDIS_URL: redis://redis:6379/0
    SCHNAEPPLI_ENCRYPTION_KEYS_FILE: /run/secrets/encryption_keys
    SCHNAEPPLI_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
    SCHNAEPPLI_EBAY_CLIENT_ID_FILE: /run/secrets/ebay_client_id
    SCHNAEPPLI_EBAY_CLIENT_SECRET_FILE: /run/secrets/ebay_client_secret
    SCHNAEPPLI_CLAUDE_CODE_BRIDGE_SECRET_FILE: /run/secrets/claude_code_bridge_secret
    SCHNAEPPLI_INBOX_PASSWORD_FILE: /run/secrets/inbox_password
  secrets: [encryption_keys, telegram_bot_token, ebay_client_id, ebay_client_secret, claude_code_bridge_secret, inbox_password]
  networks: [internal, egress]
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schnaeppli}
      POSTGRES_USER: ${POSTGRES_USER:-schnaeppli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [db:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt: ["no-new-privileges:true"]
    shm_size: 128mb

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    read_only: true
    security_opt: ["no-new-privileges:true"]

  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *backend
    command: ["arq", "app.worker.WorkerSettings"]
    healthcheck:
      test: ["CMD", "arq", "--check", "app.worker.WorkerSettings"]
      interval: 60s
      timeout: 10s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    image: ${SCHNAEPPLI_IMAGE_PREFIX:-schnaeppli}-web:${SCHNAEPPLI_VERSION:-latest}
    build: ./frontend
    restart: unless-stopped
    networks: [internal, proxy]
    ports:
      # Bind to a private address only. Never publish this on a public interface.
      - "${SCHNAEPPLI_BIND:-127.0.0.1:8080}:8080"
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    depends_on: [api]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-schnaeppli}
      POSTGRES_DB: ${POSTGRES_DB:-schnaeppli}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db: { condition: service_healthy }

secrets:
  encryption_keys: { file: ./secrets/encryption_keys }
  telegram_bot_token: { file: ./secrets/telegram_bot_token }
  ebay_client_id: { file: ./secrets/ebay_client_id }
  ebay_client_secret: { file: ./secrets/ebay_client_secret }
  claude_code_bridge_secret: { file: ./secrets/claude_code_bridge_secret }
  inbox_password: { file: ./secrets/inbox_password }

volumes:
  db:

networks:
  internal:
    internal: true
  egress: {}  # outbound only: AI providers, eBay, Telegram, listing images
  proxy:
    name: ${SCHNAEPPLI_PROXY_NETWORK:-schnaeppli-proxy}
